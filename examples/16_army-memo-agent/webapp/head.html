<title>AR 25-50 Army Memorandum Builder</title>
<style>
  /*
   * Identity: the orderly room, digitized. Warm stone paper, green-black
   * ink, one brass accent used sparingly - the world of the document
   * without costume. The memorandum itself stays Arial because the
   * regulation says so, and the chrome never competes with the sheet.
   *
   * Shape: two visible steps and a download bar. Everything optional
   * folds away - a blank field already comes out as a click-to-type slot
   * in Word, so nothing hidden can hurt the result.
   */
  :root {
    --paper:#f2f0e9; --panel:#fbfaf5; --ink:#22261e; --dim:#6d7163; --line:#dcd8c9;
    --accent:#7a6120; --accent-strong:#a8862c; --accent-ink:#fff;
    --err:#9d1c1c; --err-bg:#f6e4e4; --warn:#8a5a00; --warn-bg:#f4ecdc;
    --ok:#2e6b3f; --chip:#eceadf; --sheetbg:#585c54; --shadow:rgba(30,32,26,.28);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#15170f; --panel:#1d2016; --ink:#e9e7db; --dim:#9fa392; --line:#363a2c;
      --accent:#d3b25f; --accent-strong:#c2a145; --accent-ink:#191b12;
      --err:#ff9d9d; --err-bg:#3a2020; --warn:#e8c06a; --warn-bg:#37301c;
      --ok:#8fd6a4; --chip:#282b1f; --sheetbg:#101208; --shadow:rgba(0,0,0,.55); }
  }
  :root[data-theme="dark"] { --paper:#15170f; --panel:#1d2016; --ink:#e9e7db; --dim:#9fa392; --line:#363a2c;
      --accent:#d3b25f; --accent-strong:#c2a145; --accent-ink:#191b12;
      --err:#ff9d9d; --err-bg:#3a2020; --warn:#e8c06a; --warn-bg:#37301c;
      --ok:#8fd6a4; --chip:#282b1f; --sheetbg:#101208; --shadow:rgba(0,0,0,.55); }
  :root[data-theme="light"] { --paper:#f2f0e9; --panel:#fbfaf5; --ink:#22261e; --dim:#6d7163; --line:#dcd8c9;
      --accent:#7a6120; --accent-strong:#a8862c; --accent-ink:#fff;
      --err:#9d1c1c; --err-bg:#f6e4e4; --warn:#8a5a00; --warn-bg:#f4ecdc;
      --ok:#2e6b3f; --chip:#eceadf; --sheetbg:#585c54; --shadow:rgba(30,32,26,.28); }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }

  .masthead { border-top:4px solid var(--accent-strong); background:var(--panel);
           border-bottom:1px solid var(--line); padding:24px 28px 20px; }
  .masthead h1 { margin:0; font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
              font-size:26px; font-weight:600; letter-spacing:.005em; text-wrap:balance; }
  .masthead .kicker { margin:0 0 6px; font-size:11px; font-weight:700; letter-spacing:.14em;
                   text-transform:uppercase; color:var(--accent); }
  .masthead .sub { margin:6px 0 0; color:var(--dim); font-size:14px; max-width:64ch; }

  main { display:grid; grid-template-columns:minmax(340px,430px) 1fr; align-items:start; }
  @media (max-width:920px) { main { grid-template-columns:1fr; } }

  form { padding:8px 26px 96px; border-right:1px solid var(--line); background:var(--panel); min-height:100vh; }
  @media (max-width:920px) { form { min-height:0; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px; } }

  fieldset { border:0; margin:0; padding:22px 0 6px; }
  fieldset + fieldset { border-top:1px solid var(--line); }
  legend { padding:0; display:flex; align-items:baseline; gap:10px; font-size:12px; font-weight:700;
           letter-spacing:.1em; text-transform:uppercase; color:var(--ink); }
  legend .step, .actionbar .step { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
                 font-size:19px; font-weight:600; color:var(--accent); letter-spacing:0; min-width:16px; }
  legend + p { margin:8px 0 6px; color:var(--dim); font-size:13px; max-width:56ch; }

  label { display:block; margin:14px 0 5px; font-size:13px; font-weight:600; }
  label em { display:block; font-weight:400; font-style:normal; color:var(--dim); font-size:12px; margin-top:1px; }
  input, textarea, select { width:100%; padding:9px 11px; border:1px solid var(--line);
    border-radius:7px; background:var(--paper); color:var(--ink); font:inherit; }
  textarea { resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; line-height:1.5; }
  input::placeholder, textarea::placeholder { color:var(--dim); opacity:.7; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible,
  summary:focus-visible { outline:2px solid var(--accent-strong); outline-offset:1px; }

  /* The one decision that drives everything else gets the biggest control. */
  #type { font-size:15px; font-weight:600; padding:12px; }

  label.checkbox { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; }
  label.checkbox input[type=checkbox] { width:auto; accent-color:var(--accent-strong); }
  label.checkbox em { flex-basis:100%; margin-left:22px; }

  .counter { margin:5px 2px 0 0; font-size:12px; color:var(--dim); text-align:right;
             font-variant-numeric:tabular-nums; }
  .counter.over { color:var(--warn); font-weight:700; }

  button { border:0; border-radius:7px; padding:10px 16px; font:inherit; font-weight:650; cursor:pointer;
           background:var(--accent-strong); color:var(--accent-ink); }
  button:hover { filter:brightness(1.06); }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button.secondary:hover { border-color:var(--accent); filter:none; }
  button[disabled] { opacity:.5; cursor:progress; }
  button.inline { margin-top:10px; padding:8px 12px; font-size:13px; }

  /* Optional material folds away; the summary promises blanks are safe. */
  details.extra { margin:16px 0 0; border:1px solid var(--line); border-radius:9px; background:var(--paper); }
  details.extra > summary { cursor:pointer; list-style:none; padding:12px 14px; }
  details.extra > summary::-webkit-details-marker { display:none; }
  details.extra > summary .sumtitle { font-size:13px; font-weight:700; }
  details.extra > summary .sumtitle::before { content:"▸"; display:inline-block; width:16px; color:var(--accent); }
  details.extra[open] > summary .sumtitle::before { content:"▾"; }
  details.extra > summary em { display:block; margin:2px 0 0 16px; font-style:normal; font-weight:400;
                               color:var(--dim); font-size:12px; }
  details.extra > .inner { padding:0 14px 16px; }
  details.extra > .inner > label:first-child { margin-top:6px; }

  /* One place to act, always in reach. */
  .actionbar { position:sticky; bottom:0; margin:26px -26px 0; padding:14px 26px;
               display:flex; gap:10px; align-items:center;
               background:var(--panel); border-top:1px solid var(--line); }
  .actionbar button { flex:0 0 auto; white-space:nowrap; }
  .actionbar #dl { flex:1 1 auto; padding:13px 16px; font-size:15px; }

  #out { padding:22px 26px 48px; min-width:0; position:sticky; top:0; max-height:100vh; overflow:auto; }
  @media (max-width:920px) { #out { position:static; max-height:none; } }

  .viewerbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
  .viewerbar .vtitle { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
                       font-size:17px; font-weight:600; margin-right:auto; }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; background:var(--chip);
          color:var(--ink); font-size:12px; font-weight:600; letter-spacing:.02em; white-space:nowrap; }
  .pill.err { background:var(--err-bg); color:var(--err); }

  #preview { background:var(--sheetbg); border:1px solid var(--line); border-radius:10px;
             padding:26px 0; overflow:hidden; min-height:220px; display:flex;
             align-items:center; justify-content:center; }
  #preview .page { box-shadow:0 10px 30px var(--shadow) !important; }
  #preview .emptystate { margin:0; padding:0 32px; color:#cfcdc2; font-size:14px;
                          text-align:center; max-width:34ch; }
  :root[data-theme="dark"] #preview .emptystate { color:#9a9d92; }
  :root[data-theme="light"] #preview .emptystate { color:#cfcdc2; }
  @media (prefers-color-scheme: dark) { #preview .emptystate { color:#9a9d92; } }

  .note { margin:10px 0 0; font-size:13px; color:var(--dim); }
  .note b { color:var(--ink); }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }

  /* Findings as cards a person reads, not log lines. */
  ul.findings { list-style:none; margin:0 0 14px; padding:0; display:grid; gap:8px; }
  ul.findings li { background:var(--paper); border:1px solid var(--line); border-radius:8px;
                   padding:10px 12px; font-size:13px; line-height:1.5; }
  ul.findings li .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px;
                        font-weight:700; letter-spacing:.06em; text-transform:uppercase;
                        background:var(--chip); color:var(--dim); margin:0 6px 4px 0; vertical-align:1px; }
  li.error { border-left:3px solid var(--err); }
  li.error .tag { background:var(--err-bg); color:var(--err); }
  li.warning { border-left:3px solid var(--warn); }
  li.warning .tag { background:var(--warn-bg); color:var(--warn); }
  .cite { display:block; margin-top:4px; color:var(--dim); font-size:12px; }
  .pass { color:var(--ok); font-weight:650; margin:0 0 12px; }
  .grouptitle { margin:14px 12px 6px; font-size:12px; font-weight:700; letter-spacing:.1em;
                text-transform:uppercase; color:var(--dim); }

  /* Blanks are a reassurance, not a to-do list - one quiet line, openable. */
  details.blanks { margin:0 0 14px; border:1px dashed var(--line); border-radius:9px; }
  details.blanks > summary { cursor:pointer; list-style:none; padding:10px 12px;
                             font-size:13px; color:var(--dim); }
  details.blanks > summary::-webkit-details-marker { display:none; }
  details.blanks > summary::before { content:"▸"; display:inline-block; width:16px; color:var(--accent); }
  details.blanks[open] > summary::before { content:"▾"; }
  details.blanks ul.findings { margin:0 12px 12px; }

  footer.pagefoot { margin:18px 2px 0; font-size:12.5px; color:var(--dim); max-width:70ch; }

  .field.hidden, fieldset.hidden, details.hidden, #digitalSignatureField.hidden { display:none; }
</style>
<div id="app"></div>
