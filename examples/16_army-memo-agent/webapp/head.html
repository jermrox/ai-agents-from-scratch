<title>AR 25-50 Army Memorandum Builder</title>
<style>
  :root {
    --ink:#16181d; --dim:#5b616e; --line:#d7dae0; --bg:#f3f4f7; --panel:#fff;
    --err:#a3121b; --warn:#7a5200; --ok:#1d6b3f; --accent:#26456b; --sheetbg:#6b6b6b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8eaee; --dim:#9aa1ae; --line:#333842; --bg:#15171b; --panel:#1c1f25;
            --err:#ff9a9f; --warn:#e5bf6a; --ok:#7fd6a2; --accent:#9dc0ee; --sheetbg:#3a3d42; }
  }
  :root[data-theme="dark"] { --ink:#e8eaee; --dim:#9aa1ae; --line:#333842; --bg:#15171b; --panel:#1c1f25;
            --err:#ff9a9f; --warn:#e5bf6a; --ok:#7fd6a2; --accent:#9dc0ee; --sheetbg:#3a3d42; }
  :root[data-theme="light"] { --ink:#16181d; --dim:#5b616e; --line:#d7dae0; --bg:#f3f4f7; --panel:#fff;
            --err:#a3121b; --warn:#7a5200; --ok:#1d6b3f; --accent:#26456b; --sheetbg:#6b6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { margin:0; font-size:17px; letter-spacing:.01em; }
  header p { margin:4px 0 0; color:var(--dim); font-size:13px; max-width:70ch; }
  main { display:grid; grid-template-columns:minmax(330px,400px) 1fr; align-items:start; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  form { padding:18px 22px 40px; border-right:1px solid var(--line); }
  fieldset { border:0; border-top:1px solid var(--line); margin:20px 0 0; padding:14px 0 0; }
  fieldset:first-of-type { border-top:0; margin-top:0; padding-top:0; }
  legend { padding:0; font-weight:600; font-size:12px; text-transform:uppercase;
           letter-spacing:.07em; color:var(--dim); }
  legend + p { margin:6px 0 12px; color:var(--dim); font-size:13px; }
  label { display:block; margin:12px 0 4px; font-size:13px; font-weight:600; }
  label em { display:block; font-weight:400; font-style:normal; color:var(--dim); font-size:12px; }
  input, textarea, select { width:100%; padding:8px 10px; border:1px solid var(--line);
    border-radius:6px; background:var(--panel); color:var(--ink); font:inherit; }
  textarea { resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  input::placeholder, textarea::placeholder { color:var(--dim); opacity:.75; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
    outline:2px solid var(--accent); outline-offset:1px; }
  label.checkbox { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; }
  label.checkbox input[type=checkbox] { width:auto; }
  label.checkbox em { flex-basis:100%; margin-left:22px; }
  .counter { margin:4px 0 0; font-size:12px; color:var(--dim); text-align:right; }
  .counter.over { color:var(--warn); font-weight:600; }
  button { margin-top:16px; width:100%; padding:11px; border:0; border-radius:6px;
    background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  :root[data-theme="dark"] button, [data-theme="dark"] button { color:#12141a; }
  @media (prefers-color-scheme: dark) { button { color:#12141a; } :root[data-theme="light"] button { color:#fff; } }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--line); margin-top:8px; }
  button[disabled] { opacity:.55; cursor:progress; }
  #out { padding:18px 22px 40px; min-width:0; position:sticky; top:0; max-height:100vh; overflow:auto; }
  @media (max-width:900px) { #out { position:static; max-height:none; } }
  #preview { background:var(--sheetbg); border:1px solid var(--line); border-radius:6px;
             padding:24px 0; overflow:hidden; }
  .note { margin:10px 0 0; font-size:13px; color:var(--dim); }
  .note b { color:var(--ink); }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  ul.findings { list-style:none; margin:0 0 14px; padding:0; }
  ul.findings li { padding:7px 0 7px 12px; border-left:3px solid var(--line); margin-bottom:6px; font-size:13px; }
  li.error { border-left-color:var(--err); } li.warning { border-left-color:var(--warn); }
  .rule { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  li.error .rule { color:var(--err); } li.warning .rule { color:var(--warn); }
  .cite { color:var(--dim); font-size:12px; }
  .pass { color:var(--ok); font-weight:600; }
  .field.hidden, fieldset.hidden, #digitalSignatureField.hidden { display:none; }
</style>
<div id="app"></div>
